name: Send announcement

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (list how many would be emailed, send nothing)'
        type: boolean
        default: true

concurrency:
  group: send-announcement
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install root dependencies (nodemailer)
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Send announcement
        env:
          REMINDER_SECRET: ${{ secrets.REMINDER_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          APP_URL: ${{ secrets.APP_URL }}
          DRY: ${{ inputs.dry_run && '--dry' || '' }}
        run: node scripts/send-announcement.mjs $DRY
