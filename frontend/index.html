<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welile School Student Dashboard</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #faf8f5; /* Warm paper background */
        transition: background-color 0.2s, color 0.2s;
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Dark mode CSS overrides for Admin Console and other legacy sections */
      .dark body {
        background-color: #020617; /* slate-950 */
      }
      .dark .bg-white {
        background-color: #0f172a !important; /* slate-900 */
        border-color: #1e293b !important; /* slate-800 */
        color: #f8fafc !important; /* slate-50 */
      }
      .dark .border-gray-50,
      .dark .border-gray-100,
      .dark .border-gray-150,
      .dark .border-gray-200,
      .dark .border-gray-250,
      .dark .divide-gray-100,
      .dark .divide-gray-200 {
        border-color: #1e293b !important;
      }
      .dark .bg-gray-50 {
        background-color: #1e293b !important; /* slate-800 */
      }
      .dark .hover\:bg-gray-50:hover,
      .dark tr.hover\:bg-gray-50:hover {
        background-color: #1e293b !important;
      }
      .dark .text-gray-900,
      .dark .text-gray-800,
      .dark .text-gray-700 {
        color: #f1f5f9 !important; /* slate-100 */
      }
      .dark .text-gray-600,
      .dark .text-gray-500,
      .dark .text-gray-400 {
        color: #94a3b8 !important; /* slate-400 */
      }
      .dark input,
      .dark select,
      .dark textarea {
        background-color: #1e293b !important;
        border-color: #334155 !important;
        color: #f8fafc !important;
      }
      .dark input::placeholder,
      .dark textarea::placeholder {
        color: #64748b !important;
      }
      [contenteditable]:empty:before {
        content: attr(data-placeholder);
        color: #94a3b8;
        cursor: text;
        display: block;
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Source Serif 4"', 'Georgia', 'serif'],
            },
            colors: {
              welile: {
                dark: '#111111',
                gray: '#222222',
                purple: '#6d28d9', // Primary accent (deep violet)
                lightPurple: '#f3e8ff', // Brighter light purple
                lime: '#d9f99d', // Secondary Accent for specific buttons
              },
              violet: {
                50: '#faf5ff',
                100: '#f3e8ff',
                200: '#e9d5ff',
                300: '#d8b4fe',
                400: '#c084fc',
                500: '#7c3aed',
                600: '#6d28d9', // deep violet (primary buttons)
                700: '#5b21b6', // hover
                800: '#7e22ce',
                900: '#581c87',
                950: '#2e1065',
              }
            }
          }
        }
      }
    </script>
    <script>
      // One-time migration: reset to light mode default
      if (!localStorage.getItem('theme-v2-migrated')) {
        localStorage.removeItem('theme');
        localStorage.setItem('theme-v2-migrated', 'true');
      }
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>

<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
